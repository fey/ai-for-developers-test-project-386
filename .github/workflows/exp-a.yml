name: exp-a

on:
  issue_comment:
    types: [created]

jobs:
  run:
    if: startsWith(github.event.comment.body, '/expa') && github.event.comment.user.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      id-token: write
      contents: read
      pull-requests: read
      issues: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
      - name: Install skills
        run: npx --yes skills@latest add mattpocock/skills --skill '*' --agent opencode --global --yes

      - name: Run opencode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}

        with:
          model: opencode/claude-haiku-5-5
          mentions: /expa
